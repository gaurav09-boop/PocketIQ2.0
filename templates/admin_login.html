<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket IQ 2.0 Admin</title><link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='pocketiq-logo.png') }}"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-body"><main class="auth-card admin-login"><a class="brand" href="/"><span class="brand-mark">P</span>Pocket<span>IQ</span></a><p class="eyebrow">ADMIN AREA</p><h2>Manage saving quotes</h2>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="action" value="login"><label>Admin password<input type="password" name="password" required></label><button class="primary-btn">Open admin panel</button></form><a class="back-link" href="/">← Back to Pocket IQ 2.0</a></main></body></html>

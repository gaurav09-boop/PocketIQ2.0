services:
  - type: web
    name: pocket-iq-2-0
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POCKETIQ_SECRET
        generateValue: true
      - key: POCKETIQ_ADMIN_PASSWORD
        sync: false
